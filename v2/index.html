<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數藥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：手機單欄。上方大數字讀數，中間照片，下方操作；像藥局數藥盤一樣，數字最大。 */
:root {
  --bg: #eaf0f3;
  --surface: #ffffff;
  --ink: #12303d;
  --muted: #587180;
  --accent: #0b7a8f;
  --on-accent: #ffffff;
  --mark: #d9500a;
  --line: #cfdbe2;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Noto Sans TC", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d181e; --surface: #15252d; --ink: #e4eef2; --muted: #8ea6b2;
    --accent: #45bfd6; --on-accent: #06222a; --mark: #ff8a3d; --line: #26404b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d181e; --surface: #15252d; --ink: #e4eef2; --muted: #8ea6b2;
  --accent: #45bfd6; --on-accent: #06222a; --mark: #ff8a3d; --line: #26404b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
.app { max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 2px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .08em; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }

.readout {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 18px 12px;
}
.count { display: flex; align-items: baseline; gap: 6px; }
#count { font-family: var(--font-num); font-size: 84px; line-height: .95; font-variant-numeric: tabular-nums; color: var(--mark); }
.unit { font-size: 20px; font-weight: 500; color: var(--muted); }
.state { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; padding-bottom: 6px; }
.chip { display: inline-block; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); }
.chip.edited { border-color: var(--mark); color: var(--mark); }
#detail { font-size: 13px; color: var(--muted); }

.stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
#view { display: block; width: 100%; height: auto; touch-action: manipulation; cursor: crosshair; }
#busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,24,30,.55); color: #fff; font-weight: 500; }
#busy[hidden] { display: none; }
.tip { margin: -6px 2px 0; font-size: 14px; color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 8px 14px;
  border-radius: 12px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  font: 500 17px var(--font-body); cursor: pointer; text-align: center;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.wide { grid-column: 1 / -1; }
.btn:focus-visible, .pick:focus-within, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.pick { position: relative; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field small { color: var(--muted); font-size: 13px; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
input[type="text"] { font: 16px var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
#msg { min-height: 1.6em; font-size: 14px; color: var(--muted); margin: 0; }
#msg.warn { color: var(--mark); }
#fallback img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
#fallback[hidden] { display: none; }
.notes h2 { font-size: 15px; margin: 0; }
.notes ul { margin: 0; padding-left: 1.2em; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>數藥</h1>
    <p class="sub">拍一張照片，自動數出藥粒，再把標好數字的照片存起來。</p>
  </header>

  <section class="readout" aria-live="polite">
    <div class="count"><span id="count">0</span><span class="unit">粒</span></div>
    <div class="state">
      <span id="chip" class="chip">示範照片</span>
      <span id="detail">換成你的照片就會重新計數</span>
    </div>
  </section>

  <div class="stage">
    <canvas id="view" width="1000" height="750" aria-label="照片與藥粒標記"></canvas>
    <div id="busy" hidden>辨識中…</div>
  </div>
  <p class="tip">數字標錯時：點橘色圓點可以移除，點沒標到的藥粒可以補上。</p>

  <div class="actions">
    <label class="btn primary pick" for="cam">拍照<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn pick" for="lib">選照片<input id="lib" type="file" accept="image/*"></label>
    <button class="btn primary wide" id="save" type="button">儲存標記照片</button>
  </div>
  <p id="msg" role="status"></p>
  <div id="fallback" hidden><img id="fallbackImg" alt="標記好的照片"></div>

  <section class="panel">
    <div class="field">
      <label for="sens">辨識靈敏度</label>
      <input id="sens" type="range" min="1" max="9" step="1" value="5">
      <div class="ends"><span>數太多時往左</span><span>數太少時往右</span></div>
      <small>調整後會重新辨識，手動修正會被清掉。</small>
    </div>
    <div class="field">
      <label for="note">備註（會印在存下來的照片上，可不填）</label>
      <input id="note" type="text" maxlength="30" placeholder="例如：藥名、批次" autocomplete="off">
    </div>
  </section>

  <section class="panel notes">
    <h2>拍得準的四個條件</h2>
    <ul>
      <li>底色素面，而且和藥粒顏色差很多（白藥用深色或藍色藥盤）。</li>
      <li>畫面裡只有同一種藥，整張照片盡量只拍到藥盤。</li>
      <li>藥粒攤開。兩三粒相碰可以分辨，疊在一起就不行。</li>
      <li>從正上方拍，避開強烈反光和很深的影子。</li>
    </ul>
    <ul>
      <li>每粒藥上都有編號，交付前請對著照片目視核對一次。</li>
      <li>照片只在這台裝置上處理，不會上傳。</li>
    </ul>
  </section>
</main>

<script id="algo">
/* 數藥演算法：背景色分離 → 連通區塊 → 以單顆面積推算相碰的顆數。純函式，不碰 DOM。 */
function countPills(rgba, w, h, factor) {
  var N = w * h, i, x, y;
  var lin = new Float32Array(256);
  for (i = 0; i < 256; i++) { var c = i / 255; lin[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 0.137931; }
  var L = new Float32Array(N), A = new Float32Array(N), B = new Float32Array(N);
  var bin = new Uint16Array(N), hist = new Uint32Array(20 * 32 * 32);
  for (i = 0; i < N; i++) {
    var r = lin[rgba[4 * i]], g = lin[rgba[4 * i + 1]], b = lin[rgba[4 * i + 2]];
    var fx = f((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047);
    var fy = f(0.2126 * r + 0.7152 * g + 0.0722 * b);
    var fz = f((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883);
    var l = 116 * fy - 16, a = 500 * (fx - fy), bb = 200 * (fy - fz);
    L[i] = l; A[i] = a; B[i] = bb;
    var ql = Math.min(19, Math.max(0, (l / 5) | 0));
    var qa = Math.min(31, Math.max(0, (a + 128) >> 3)), qb = Math.min(31, Math.max(0, (bb + 128) >> 3));
    var q = ql * 1024 + qa * 32 + qb; bin[i] = q; hist[q]++;
  }
  // 1. 全域背景色：佔最多面積的顏色
  var best = 0; for (i = 1; i < hist.length; i++) if (hist[i] > hist[best]) best = i;
  var gl = 0, ga = 0, gb = 0, gn = 0;
  for (i = 0; i < N; i++) if (bin[i] === best) { gl += L[i]; ga += A[i]; gb += B[i]; gn++; }
  gl /= gn; ga /= gn; gb /= gn;
  var WL = 0.7, D = new Float32Array(N);
  for (i = 0; i < N; i++) { var dl = WL * (L[i] - gl), da = A[i] - ga, db = B[i] - gb; D[i] = Math.sqrt(dl * dl + da * da + db * db); }
  function otsu(D) {
    var H = new Float64Array(256), i, n = D.length;
    for (i = 0; i < n; i++) H[Math.min(255, (D[i] * 2) | 0)]++;
    var sum = 0; for (i = 0; i < 256; i++) sum += i * H[i];
    var wB = 0, sB = 0, bestV = -1, bestT = 0;
    for (i = 0; i < 256; i++) {
      wB += H[i]; if (!wB) continue; var wF = n - wB; if (!wF) break;
      sB += i * H[i]; var mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
      if (v > bestV) { bestV = v; bestT = i; }
    }
    return (bestT + 1) / 2;
  }
  var t0 = Math.max(7, otsu(D));
  // 2. 區域背景：用非藥粒像素的區域平均，抵銷光線不均
  var W1 = w + 1, S = [new Float64Array(W1 * (h + 1)), new Float64Array(W1 * (h + 1)), new Float64Array(W1 * (h + 1)), new Float64Array(W1 * (h + 1))];
  for (y = 0; y < h; y++) {
    var rl = 0, ra = 0, rb = 0, rn = 0;
    for (x = 0; x < w; x++) {
      i = y * w + x;
      if (D[i] <= t0) { rl += L[i]; ra += A[i]; rb += B[i]; rn++; }
      var o = (y + 1) * W1 + x + 1, up = y * W1 + x + 1;
      S[0][o] = S[0][up] + rl; S[1][o] = S[1][up] + ra; S[2][o] = S[2][up] + rb; S[3][o] = S[3][up] + rn;
    }
  }
  var R = Math.max(8, Math.round(Math.max(w, h) / 8));
  for (y = 0; y < h; y++) {
    var y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
    for (x = 0; x < w; x++) {
      var x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
      var p00 = y0 * W1 + x0, p01 = y0 * W1 + x1, p10 = y1 * W1 + x0, p11 = y1 * W1 + x1;
      var n = S[3][p11] - S[3][p01] - S[3][p10] + S[3][p00];
      var bl = gl, ba = ga, bb2 = gb;
      if (n > 0.08 * (x1 - x0) * (y1 - y0)) {
        bl = (S[0][p11] - S[0][p01] - S[0][p10] + S[0][p00]) / n;
        ba = (S[1][p11] - S[1][p01] - S[1][p10] + S[1][p00]) / n;
        bb2 = (S[2][p11] - S[2][p01] - S[2][p10] + S[2][p00]) / n;
      }
      i = y * w + x;
      var e1 = WL * (L[i] - bl), e2 = A[i] - ba, e3 = B[i] - bb2;
      D[i] = Math.sqrt(e1 * e1 + e2 * e2 + e3 * e3);
    }
  }
  var thr = Math.min(70, Math.max(7, otsu(D) / factor));
  var mask = new Uint8Array(N);
  for (i = 0; i < N; i++) mask[i] = D[i] > thr ? 1 : 0;
  // 3. 去雜點（開運算 3x3）
  function morph(src, erode) {
    var tmp = new Uint8Array(N), out = new Uint8Array(N), x, y, i, v;
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
      i = y * w + x; var l = x > 0 ? src[i - 1] : (erode ? 0 : 0), r = x < w - 1 ? src[i + 1] : 0;
      v = erode ? (src[i] & l & r) : (src[i] | l | r); tmp[i] = v;
    }
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
      i = y * w + x; var u = y > 0 ? tmp[i - w] : 0, d = y < h - 1 ? tmp[i + w] : 0;
      out[i] = erode ? (tmp[i] & u & d) : (tmp[i] | u | d);
    }
    return out;
  }
  mask = morph(morph(mask, true), false);
  // 4. 連通區塊
  function label(mask, val, conn8) {
    var seen = new Uint8Array(N), queue = new Int32Array(N), starts = [], border = [], qt = 0, s;
    for (s = 0; s < N; s++) {
      if (mask[s] !== val || seen[s]) continue;
      starts.push(qt); var qh = qt, tb = false; queue[qt++] = s; seen[s] = 1;
      while (qh < qt) {
        var p = queue[qh++], px = p % w, py = (p - px) / w;
        if (px === 0 || py === 0 || px === w - 1 || py === h - 1) tb = true;
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue; if (!conn8 && dx && dy) continue;
          var nx = px + dx, ny = py + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          var q = ny * w + nx; if (mask[q] === val && !seen[q]) { seen[q] = 1; queue[qt++] = q; }
        }
      }
      border.push(tb);
    }
    starts.push(qt);
    return { queue: queue, starts: starts, border: border, n: border.length };
  }
  function median(arr) { var s = arr.slice().sort(function (a, b) { return a - b; }); return s.length ? s[s.length >> 1] : 0; }
  var minA = Math.max(30, N * 0.00008), k, j;
  var c1 = label(mask, 1, true), a1 = [];
  for (k = 0; k < c1.n; k++) { var ar = c1.starts[k + 1] - c1.starts[k]; if (ar >= minA) a1.push(ar); }
  if (!a1.length) return { markers: [], r: 12 };
  // 補洞（刻字、反光造成的小洞）
  var holeMax = 0.5 * median(a1), c0 = label(mask, 0, false);
  for (k = 0; k < c0.n; k++) {
    if (c0.border[k] || c0.starts[k + 1] - c0.starts[k] >= holeMax) continue;
    for (j = c0.starts[k]; j < c0.starts[k + 1]; j++) mask[c0.queue[j]] = 1;
  }
  var cc = label(mask, 1, true), comps = [];
  for (k = 0; k < cc.n; k++) { var a2 = cc.starts[k + 1] - cc.starts[k]; if (a2 >= minA) comps.push({ s: cc.starts[k], e: cc.starts[k + 1], a: a2 }); }
  // 5. 單顆面積：讓所有區塊面積最接近整數倍的那個值
  var bestCost = Infinity, u = comps[0].a;
  for (k = 0; k < comps.length; k++) {
    var cand = comps[k].a, cost = 0;
    for (j = 0; j < comps.length; j++) { var qq = comps[j].a / cand, kk = Math.max(1, Math.round(qq)); cost += Math.min(1, Math.abs(qq - kk)); }
    if (cost < bestCost - 1e-9) { bestCost = cost; u = cand; }
  }
  var ratios = [];
  for (k = 0; k < comps.length; k++) { var k2 = Math.round(comps[k].a / u); if (k2 >= 1 && k2 <= 2) ratios.push(comps[k].a / k2); }
  if (ratios.length) u = median(ratios);
  // 6. 每個區塊放標記；相碰的區塊用 k-means 分開位置
  var markers = [];
  for (k = 0; k < comps.length; k++) {
    var cp = comps[k]; if (cp.a < 0.35 * u) continue;
    var cnt = Math.max(1, Math.round(cp.a / u)), step = Math.max(1, Math.ceil(cp.a / 1500)), xs = [], ys = [];
    for (j = cp.s; j < cp.e; j += step) { var pp = cc.queue[j]; xs.push(pp % w); ys.push((pp / w) | 0); }
    var m = xs.length, mx = 0, my = 0; for (j = 0; j < m; j++) { mx += xs[j]; my += ys[j]; } mx /= m; my /= m;
    if (cnt === 1) { markers.push({ x: mx, y: my }); continue; }
    var cx = [], cy = [], dmin = new Float64Array(m).fill(Infinity), far = 0, fd = -1;
    for (j = 0; j < m; j++) { var d0 = (xs[j] - mx) * (xs[j] - mx) + (ys[j] - my) * (ys[j] - my); if (d0 > fd) { fd = d0; far = j; } }
    for (var ci = 0; ci < cnt; ci++) {
      cx.push(xs[far]); cy.push(ys[far]); fd = -1;
      for (j = 0; j < m; j++) { var d1 = (xs[j] - cx[ci]) * (xs[j] - cx[ci]) + (ys[j] - cy[ci]) * (ys[j] - cy[ci]); if (d1 < dmin[j]) dmin[j] = d1; if (dmin[j] > fd) { fd = dmin[j]; far = j; } }
    }
    for (var it = 0; it < 12; it++) {
      var sx = new Float64Array(cnt), sy = new Float64Array(cnt), sn = new Float64Array(cnt);
      for (j = 0; j < m; j++) {
        var bi = 0, bd = Infinity;
        for (ci = 0; ci < cnt; ci++) { var d2 = (xs[j] - cx[ci]) * (xs[j] - cx[ci]) + (ys[j] - cy[ci]) * (ys[j] - cy[ci]); if (d2 < bd) { bd = d2; bi = ci; } }
        sx[bi] += xs[j]; sy[bi] += ys[j]; sn[bi]++;
      }
      for (ci = 0; ci < cnt; ci++) if (sn[ci]) { cx[ci] = sx[ci] / sn[ci]; cy[ci] = sy[ci] / sn[ci]; }
    }
    for (ci = 0; ci < cnt; ci++) markers.push({ x: cx[ci], y: cy[ci] });
  }
  markers.sort(function (p, q) { return (p.y - q.y) || (p.x - q.x); });
  return { markers: markers, r: Math.sqrt(u / Math.PI) };
}
</script>

<script>
(function () {
  var MAX_WORK = 1000, MAX_SAVE = 1600, MARK = '#d9500a';
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), vctx = view.getContext('2d');
  var src = document.createElement('canvas');
  var work = null, markers = [], unitR = 12, autoN = 0, added = 0, removed = 0, isDemo = true;
  var downloads = null, inClaude = !!(window.claude && window.claude.use);
  if (inClaude) window.claude.use('downloads').then(function (d) { downloads = d; }).catch(function () {});

  function say(text, warn) { var m = $('msg'); m.textContent = text || ''; m.className = warn ? 'warn' : ''; }

  function setSource(drawable, sw, sh, demo) {
    var s = Math.min(1, MAX_SAVE / Math.max(sw, sh));
    src.width = Math.max(1, Math.round(sw * s)); src.height = Math.max(1, Math.round(sh * s));
    src.getContext('2d').drawImage(drawable, 0, 0, src.width, src.height);
    var ws = Math.min(1, MAX_WORK / Math.max(src.width, src.height));
    view.width = Math.max(1, Math.round(src.width * ws)); view.height = Math.max(1, Math.round(src.height * ws));
    var wc = document.createElement('canvas'); wc.width = view.width; wc.height = view.height;
    var wctx = wc.getContext('2d', { willReadFrequently: true }); wctx.drawImage(src, 0, 0, wc.width, wc.height);
    work = wctx.getImageData(0, 0, wc.width, wc.height);
    isDemo = demo; $('fallback').hidden = true;
    analyze();
  }

  function analyze() {
    if (!work) return;
    $('busy').hidden = false;
    vctx.drawImage(src, 0, 0, view.width, view.height);
    setTimeout(function () {
      try {
        var factor = 0.5 + (Number($('sens').value) - 1) / 8;
        var res = countPills(work.data, work.width, work.height, factor);
        markers = res.markers; unitR = res.r; autoN = markers.length; added = 0; removed = 0;
        if (!isDemo) say(autoN ? '' : '沒有找到藥粒。請換素色、和藥粒顏色差異大的底再拍一次，或把靈敏度往右調。', !autoN);
      } catch (e) { markers = []; say('辨識時發生錯誤，請換一張照片再試。', true); }
      $('busy').hidden = true; render();
    }, 30);
  }

  function drawMarkers(ctx, scale) {
    var mr = Math.min(26, Math.max(9, unitR * 0.5)) * scale;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < markers.length; i++) {
      var x = markers[i].x * scale, y = markers[i].y * scale, t = String(i + 1);
      ctx.beginPath(); ctx.arc(x, y, mr, 0, Math.PI * 2);
      ctx.fillStyle = MARK; ctx.fill(); ctx.lineWidth = Math.max(1.5, mr * 0.14); ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.round(mr * (t.length > 2 ? 0.85 : 1.1)) + 'px Arial, sans-serif';
      ctx.fillText(t, x, y + mr * 0.06);
    }
  }

  function render() {
    vctx.drawImage(src, 0, 0, view.width, view.height);
    drawMarkers(vctx, 1);
    $('count').textContent = markers.length;
    var chip = $('chip'), edited = added || removed;
    chip.className = 'chip' + (edited ? ' edited' : '');
    chip.textContent = edited ? '已手動修正' : (isDemo ? '示範照片' : '自動辨識');
    $('detail').textContent = edited ? ('自動 ' + autoN + ' 粒，補 ' + added + '、刪 ' + removed)
      : (isDemo ? '換成你的照片就會重新計數' : '請對照編號目視核對');
  }

  view.addEventListener('click', function (e) {
    if (!work || !$('busy').hidden) return;
    var rc = view.getBoundingClientRect(), k = view.width / rc.width;
    var x = (e.clientX - rc.left) * k, y = (e.clientY - rc.top) * k;
    var hit = Math.max(unitR * 0.8, 16 * k), bi = -1, bd = hit * hit;
    for (var i = 0; i < markers.length; i++) { var d = (markers[i].x - x) * (markers[i].x - x) + (markers[i].y - y) * (markers[i].y - y); if (d < bd) { bd = d; bi = i; } }
    if (bi >= 0) { markers.splice(bi, 1); removed++; } else { markers.push({ x: x, y: y }); added++; }
    render();
  });

  function onPick(e) {
    var file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { say(''); setSource(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(url); };
    img.onerror = function () { URL.revokeObjectURL(url); say('這個檔案無法當成照片開啟，請改選 JPG 或 PNG。', true); };
    img.src = url;
  }
  $('cam').addEventListener('change', onPick);
  $('lib').addEventListener('change', onPick);
  $('sens').addEventListener('change', analyze);

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function compose() {
    var W = src.width, H = src.height, bh = Math.round(Math.max(64, W * 0.085));
    var c = document.createElement('canvas'); c.width = W; c.height = H + bh;
    var ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
    drawMarkers(ctx, W / view.width);
    ctx.fillStyle = '#12303d'; ctx.fillRect(0, H, W, bh);
    var d = new Date(), when = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    var note = $('note').value.trim(), padX = bh * 0.3;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffb27a'; ctx.font = '700 ' + Math.round(bh * 0.6) + 'px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    var big = markers.length + ' 粒'; ctx.fillText(big, padX, H + bh * 0.53);
    var used = padX + ctx.measureText(big).width + padX;
    ctx.fillStyle = '#e4eef2'; ctx.font = '400 ' + Math.round(bh * 0.28) + 'px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'right'; ctx.fillText(when, W - padX, H + bh * (note ? 0.33 : 0.52), W - used - padX);
    if (note) ctx.fillText(note, W - padX, H + bh * 0.7, W - used - padX);
    var name = '數藥_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '_' + markers.length + '粒.jpg';
    return new Promise(function (ok) { c.toBlob(function (b) { ok({ blob: b, name: name }); }, 'image/jpeg', 0.92); });
  }

  function showFallback(blob, text) {
    $('fallbackImg').src = URL.createObjectURL(blob); $('fallback').hidden = false; say(text, true);
  }

  $('save').addEventListener('click', function () {
    if (!work) return;
    compose().then(function (out) {
      if (!out.blob) { say('照片產生失敗，請再試一次。', true); return; }
      if (downloads) {
        downloads.save({ filename: out.name, data: out.blob }).then(function () { say('已儲存：' + out.name); })
          .catch(function (err) {
            if (err && err.code === 'declined') say('已取消儲存。');
            else showFallback(out.blob, '這裡無法直接存檔。請長按（電腦按右鍵）下面的照片來儲存。');
          });
      } else if (inClaude) {
        showFallback(out.blob, '這裡無法直接存檔。請長按（電腦按右鍵）下面的照片來儲存。');
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(out.blob); a.download = out.name;
        document.body.appendChild(a); a.click(); a.remove(); say('已儲存：' + out.name);
      }
    });
  });

  // 示範照片：藍色藥盤上的白色圓錠，含幾組相碰的藥粒
  function demo() {
    var c = document.createElement('canvas'); c.width = 1200; c.height = 900; var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 1200, 900); g.addColorStop(0, '#2f6f9e'); g.addColorStop(1, '#1f4f78');
    x.fillStyle = g; x.fillRect(0, 0, 1200, 900);
    var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var R = 44, pts = [[300, 300], [388, 302], [760, 520], [822, 582], [540, 700], [628, 700], [584, 624]], tries = 0;
    while (pts.length < 26 && tries++ < 4000) {
      var px = 90 + rnd() * 1020, py = 90 + rnd() * 720, ok = true;
      for (var i = 0; i < pts.length; i++) if (Math.hypot(pts[i][0] - px, pts[i][1] - py) < R * 2.5) { ok = false; break; }
      if (ok) pts.push([px, py]);
    }
    pts.forEach(function (p) {
      x.beginPath(); x.arc(p[0] + 5, p[1] + 7, R, 0, 7); x.fillStyle = 'rgba(8,30,50,.28)'; x.fill();
      var pg = x.createRadialGradient(p[0] - 12, p[1] - 14, 6, p[0], p[1], R); pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#dfe5e8');
      x.beginPath(); x.arc(p[0], p[1], R, 0, 7); x.fillStyle = pg; x.fill();
      var ang = rnd() * Math.PI; x.beginPath(); x.moveTo(p[0] - Math.cos(ang) * R * .8, p[1] - Math.sin(ang) * R * .8); x.lineTo(p[0] + Math.cos(ang) * R * .8, p[1] + Math.sin(ang) * R * .8);
      x.strokeStyle = 'rgba(120,135,145,.55)'; x.lineWidth = 3; x.stroke();
    });
    setSource(c, c.width, c.height, true);
  }
  demo();
})();
</script>
</body>
</html>
